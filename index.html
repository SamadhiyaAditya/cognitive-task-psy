<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidden Rule Reversal (HRR) task</title>
<style>
:root{--bg:#23272e;--panel:#2c313a;--ink:#ece9e2;--mute:#9aa1ab;--line:#3f4651;--accent:#6fc3b2;--bad:#e58b7b;--blue:#4a90e2;--orange:#f0a030}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 .4rem}
h2{font-size:1.2rem;margin:1.6rem 0 .5rem}
p{margin:.5rem 0}.mute{color:var(--mute)}
label{display:block;margin:.9rem 0 .25rem;font-weight:600}
input,select{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto;margin-right:.5rem}
.check{display:flex;align-items:flex-start;font-weight:400;margin-top:1rem}
button{margin-top:1.4rem;margin-right:.5rem;padding:.7rem 1.2rem;border:0;border-radius:6px;background:var(--accent);color:#10231f;font:inherit;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{padding:.05rem .4rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
table{width:100%;border-collapse:collapse;margin:.8rem 0;font-size:.95rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line)}
.err{color:var(--bad);min-height:1.4em;margin-top:.8rem}
#stage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#23272e;cursor:none;z-index:10;text-align:center;padding:20px}
#stage .fix{font:300 clamp(56px,9vw,90px)/1 system-ui,sans-serif}
#stage .msg{font-size:1.15rem;max-width:560px;line-height:1.6}
#stage .sub{font-size:1rem;color:var(--mute);margin-top:1.4rem}
.cue{width:clamp(64px,10vw,96px);height:clamp(64px,10vw,96px);margin:1.2rem auto}
.cue.blue{background:var(--blue);border-radius:50%}
.cue.orange{background:var(--orange);border-radius:6px;transform:rotate(45deg) scale(.82)}
.field{display:flex;align-items:center;justify-content:space-between;width:min(80vw,640px)}
.slot{width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.tgt{display:block;width:64px;height:64px;background:#fff;border-radius:4px}
.small{font:300 48px/1 system-ui,sans-serif}
.notice{background:var(--panel);border-left:4px solid var(--accent);padding:1rem 1.1rem;margin:1.2rem 0;border-radius:0 6px 6px 0;font-size:.95rem;line-height:1.6}
.notice ul{margin:.4rem 0 0;padding-left:1.2rem}
.notice li{margin:.3rem 0}
.banner{background:#4a2a26;border-left:4px solid var(--bad);padding:.8rem 1rem;border-radius:0 6px 6px 0;margin:1rem 0}
.ok{color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<main id="screen"></main>
<div id="stage" aria-live="polite"></div>

<script>
/* ===== Hidden Rule Reversal (HRR) task — v2 =====
   Measures how people build a mental model of a cue-target rule and how fast they revise it when the rule silently reverses.
   Trial: fixation 500 ms -> cue (blue circle | orange diamond) 500 ms -> ISI 200 ms (SOA 700 ms) -> target left/right
          until response (max 1500 ms, keys F = left, J = right) -> ITI 600-1000 ms.
   Phases: 1 Acquisition (rule A), 2 Reversal (rule flipped, unannounced), 3 Re-reversal (rule A again).
   Between-subject: cue validity 85% vs 70%, cue-side mapping A vs B. The SERVER assigns the participant ID and
   balances the four condition cells, so participants never type an ID.
   Prediction probes (expected side + confidence) every `probeEvery` trials, cue alternates blue/orange.

   Data safety:
   - Server is checked before the form can be submitted (blocks start if data could not be saved).
   - Rows are sent after every block and confirmed by the server; resending is harmless (row_key dedupe).
   - Anything not confirmed is kept in this browser and retried on next page load.
   - The task can only run once per page load (no double-start).
   - Test runs: open index.html?test=1  -> stored in separate *_test tabs. Researcher tools: index.html?admin=1 */

const APP_VERSION = '2.0';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxAwo1rpr-RjyWtqttd-JJL060Q6e9EMxczmLpb1SpBmqtyMvhv7_NCYszYlsCFD2_dtw/exec';
const QS = new URLSearchParams(location.search);
const RUN_MODE = QS.has('test') ? 'test' : 'real';
const ADMIN = QS.has('admin');
const FAST = RUN_MODE === 'test' && QS.has('fast');          // automated testing only: shortens all timings

const REAL = {fixMs:500, cueMs:500, isiMs:200, maxRT:1500, itiMin:600, itiMax:1000, phases:[60,60,40], probeEvery:20, practice:6};
const CFG = FAST ? {...REAL, fixMs:20, cueMs:20, isiMs:10, maxRT:150, itiMin:10, itiMax:20} : REAL;
const PHASE_NAMES = {1:'Acquisition', 2:'Reversal', 3:'Re-reversal'};
const BACKUP = 'hrr_backup_v2', PENDING = 'hrr_pending_v2';

/* ---------- server ---------- */
async function api(body, tries = 4) {
  let last = 'network error';
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...body, run_mode:RUN_MODE})});
      const j = await r.json();
      if (j.ok || j.error === 'already_participated' || j.complete === false) return j;
      last = j.error || 'server error';
    } catch (e) { last = 'network error'; }
    await new Promise(r => setTimeout(r, 800 * 2 ** i));
  }
  return {ok:false, error:last};
}
async function ping() {
  try { const r = await fetch(SCRIPT_URL + '?action=ping'); const j = await r.json(); return !!j.ok; } catch (e) { return false; }
}
const MEM = {};      // fallback when localStorage is blocked (private mode, full quota)
const ls = {
  get: (k, d) => { try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in MEM ? JSON.parse(MEM[k]) : d; },
  set: (k, v) => { MEM[k] = JSON.stringify(v); try { localStorage.setItem(k, MEM[k]); } catch (e) {} }
};
/* pending = {session_id: {rows:[...], complete:{...}|null}} — everything not yet confirmed by the server.
   flush() removes only what the server confirmed, so rows queued while a request is in flight are never lost. */
function queue(sid, newRows, completeBody) {
  const p = ls.get(PENDING, {}); p[sid] = p[sid] || {rows:[], complete:null, run_mode:RUN_MODE};
  p[sid].rows.push(...newRows); if (completeBody) p[sid].complete = completeBody; ls.set(PENDING, p);
}
async function flush(sid) {
  let q = ls.get(PENDING, {})[sid]; if (!q) return {ok:true, nothing:true};
  if (q.run_mode && q.run_mode !== RUN_MODE) return {ok:false, error:'mode mismatch'};
  let res = {ok:true};
  if (q.rows.length) {
    const sent = new Set(q.rows.map(r => r.row_key));
    res = await api({action:'rows', session_id:sid, rows:q.rows}); if (!res.ok) return res;
    const p = ls.get(PENDING, {}); if (p[sid]) { p[sid].rows = p[sid].rows.filter(r => !sent.has(r.row_key)); ls.set(PENDING, p); }
  }
  q = ls.get(PENDING, {})[sid];
  if (q && q.complete && !q.rows.length) {
    res = await api(q.complete); if (!res.ok) return res;
    const p = ls.get(PENDING, {}); delete p[sid]; ls.set(PENDING, p);
  }
  return res;
}
async function flushAll() { for (const sid of Object.keys(ls.get(PENDING, {}))) await flush(sid); }

/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const scr = $('#screen'), stage = $('#stage');
let P = {}, rows = [], rowIdx = 0, STARTED = false;
let hiddenCount = 0, hiddenFlag = false;
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenCount++; hiddenFlag = true; } });
window.addEventListener('blur', () => { hiddenFlag = true; });

const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const fmt = (v,d=0) => Number.isFinite(v) ? v.toFixed(d) : '–';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const sleep = ms => new Promise(r => { const t0=performance.now(); const f=()=>performance.now()-t0>=ms-8 ? r() : requestAnimationFrame(f); f(); });
const opp = s => s==='left' ? 'right' : 'left';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
async function refreshHz() { const t = []; let p = performance.now(); for (let i=0;i<30;i++) { await new Promise(r=>requestAnimationFrame(r)); const n = performance.now(); t.push(n-p); p = n; } t.sort((a,b)=>a-b); return Math.round(1000 / t[15]); }

function show(html) { stage.style.display='flex'; stage.innerHTML = html; }
function hideStage() { stage.style.display='none'; stage.innerHTML=''; }

/* Physical key codes, so the task works with Caps Lock and non-English keyboard layouts. */
const CODE = {KeyF:'f', KeyJ:'j', Space:' ', KeyY:'y', KeyN:'n', Digit1:'1', Digit2:'2', Digit3:'3', Digit4:'4', Numpad1:'1', Numpad2:'2', Numpad3:'3', Numpad4:'4'};
function waitKey(keys, timeout) {
  return new Promise(res => {
    const t0 = performance.now(); let done = false;
    const fin = v => { if (done) return; done = true; removeEventListener('keydown', h, true); res(v); };
    const h = e => { if (e.repeat) return; const k = CODE[e.code] ?? e.key.toLowerCase(); if (!keys.includes(k)) return; e.preventDefault(); fin({key:k, rt:performance.now()-t0}); };
    addEventListener('keydown', h, true);
    if (timeout) sleep(timeout).then(() => fin(null));
  });
}

const FIX = '<div class="fix">+</div>';
const cueHTML = c => `<div class="cue ${c}"></div>`;
const targetHTML = side => `<div class="field"><div class="slot">${side==='left'?'<i class="tgt"></i>':''}</div><div class="small">+</div><div class="slot">${side==='right'?'<i class="tgt"></i>':''}</div></div>`;

/* ---------- rule logic ---------- */
const baseSide = cue => ((cue==='blue') === (P.mapping==='A')) ? 'left' : 'right';
const ruleSide = (cue, ph) => ph===2 ? opp(baseSide(cue)) : baseSide(cue);
function buildPhase(ph, N, v) {
  const per = N/2, validPer = Math.round(v*per), t = [];
  ['blue','orange'].forEach(c => { for (let i=0;i<per;i++) t.push({cue:c, valid:i<validPer, phase:ph}); });
  return shuffle(t);
}

/* ---------- screens ---------- */
let serverOK = false;
function renderForm() {
  hideStage();
  scr.innerHTML = `
    <h1>Hidden Rule Reversal task</h1>
    ${RUN_MODE==='test' ? '<div class="banner"><b>TEST MODE</b> – data goes to the test tabs, not the real dataset.</div>' : ''}
    <div id="srv" class="mute">Checking connection to the research server…</div>
    <div class="notice">
      <b>Before you start:</b>
      <ul>
        <li>⏱️ Takes about <b>8–10 minutes</b>. Do it in one sitting, in a quiet place.</li>
        <li>💻 Use a <b>laptop or desktop with a physical keyboard</b> (not a phone or tablet). You will use <kbd>F</kbd> and <kbd>J</kbd>.</li>
        <li>🚫 Do not switch tabs, close or refresh this page until you see the <b>"Thank you"</b> screen.</li>
        <li>🔁 Take part only once.</li>
      </ul>
    </div>
    <h2>Your details</h2>
    <label for="age">Age</label><input id="age" type="number" min="16" max="80" inputmode="numeric">
    <label for="gender">Gender</label>
    <select id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select>
    <label for="course">Course</label>
    <select id="course"><option value="">Select</option><option>B.Tech CS AI</option><option>B.Tech CS DS</option><option>BBA</option><option>B. Psychology</option><option>B. Design</option><option>Other</option></select>
    <input id="course_other" type="text" placeholder="Type your course" style="display:none;margin-top:.5rem">
    <label for="email">Email</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email">
    <label class="check"><input id="consent" type="checkbox"><span>I agree to take part. My email is stored separately and used only by the research team to contact me; analysis uses an anonymous participant number.</span></label>
    <div class="err" id="err"></div>
    <button id="go" disabled>Continue</button>
    ${ADMIN ? '<button class="alt" id="rep">Open report</button><button class="alt" id="dl-all">Download all sessions saved in this browser</button>' : ''}`;
  $('#course').onchange = () => { $('#course_other').style.display = $('#course').value==='Other' ? 'block' : 'none'; };
  ping().then(async ok => {
    serverOK = ok;
    if (ok) { await flushAll(); $('#srv').innerHTML = '<span class="ok">✓ Connected to the research server.</span>'; $('#go').disabled = false; }
    else $('#srv').innerHTML = '<div class="banner"><b>Cannot reach the research server.</b> Please do not start — your data would not be saved. Check your internet connection and reload. If this continues, contact the researcher.</div>';
  });
  if (matchMedia('(pointer:coarse)').matches && !matchMedia('(any-pointer:fine)').matches)
    $('#err').textContent = 'This looks like a phone or tablet. Please open this link on a laptop or desktop computer.';

  $('#go').onclick = async () => {
    const v = id => $('#'+id).value.trim();
    const err = m => { $('#err').textContent = m; };
    const age = +v('age'), course = v('course')==='Other' ? v('course_other') : v('course');
    if (!Number.isInteger(age) || age < 16 || age > 80) return err('Enter your age in whole years (16–80).');
    if (!v('gender')) return err('Select a gender option.');
    if (!course) return err('Select or type your course.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('email'))) return err('Enter a valid email address.');
    if (!$('#consent').checked) return err('Tick the consent box to continue.');
    if (!serverOK) return err('Not connected to the research server yet.');
    $('#go').disabled = true; err(''); $('#srv').textContent = 'Setting up your session…';
    const hz = await refreshHz();
    const res = await api({action:'start', age, gender:v('gender'), course, email:v('email').toLowerCase(),
      user_agent:navigator.userAgent, screen:`${screen.width}x${screen.height}@${devicePixelRatio}`, refresh_hz:hz, app_version:APP_VERSION});
    if (res.error === 'already_participated') { $('#srv').textContent=''; return err('Our records show this email has already completed the task. Thank you — you do not need to do it again.'); }
    if (!res.ok) { $('#go').disabled = false; $('#srv').textContent=''; return err('Could not start a session (' + res.error + '). Please try again in a moment.'); }
    P = {participant_id:res.participant_id, session_id:res.session_id, age, gender:v('gender'), course,
         validity_pct:+res.validity_pct, mapping:res.mapping, run_mode:RUN_MODE};
    renderInstructions();
  };
  if (ADMIN) {
    $('#rep').onclick = () => { location.href = 'report.html'; };
    $('#dl-all').onclick = () => { const all = ls.get(BACKUP, []); if (!all.length) return $('#err').textContent = 'No sessions saved in this browser.'; download(toCSV(all), 'HRR_browser_backup.csv'); };
  }
}

function renderInstructions() {
  scr.innerHTML = `
    <h1>How the task works</h1>
    <p>A <b>shape</b> appears in the centre of the screen: a blue circle or an orange diamond. A moment later a white square appears on the <b>left</b> or the <b>right</b>.</p>
    <p>Press <kbd>F</kbd> if the square is on the <b>left</b> and <kbd>J</kbd> if it is on the <b>right</b>. Respond as <b>fast</b> and as <b>accurately</b> as you can.</p>
    <p>The shape may give you a clue about where the square will appear. Use it if you find it helpful.</p>
    <p>Now and then the task pauses and asks where you expect the square to appear after a shape. Answer with <kbd>F</kbd> or <kbd>J</kbd>, then rate how sure you are from <kbd>1</kbd> (guessing) to <kbd>4</kbd> (certain).</p>
    <div class="notice"><b>Structure:</b> ${CFG.practice} practice trials with feedback, then 3 blocks with a short rest between blocks. Keep going until you see <b>"Thank you"</b>.</div>
    <p><b>Rest your left index finger on <kbd>F</kbd> and your right index finger on <kbd>J</kbd>. Press <kbd>F</kbd> and then <kbd>J</kbd> to start the practice.</b></p>
    <p class="mute" id="kc">Waiting for F…</p>`;
  (async () => {
    await waitKey(['f']); $('#kc').textContent = 'F ✓  — now press J'; await waitKey(['j']);
    runAll();
  })();
}

/* ---------- trial ---------- */
async function trial(cue, side, feedback) {
  hiddenFlag = false;
  show(FIX); await sleep(CFG.fixMs);
  show(cueHTML(cue)); await frame(); const tCue = performance.now(); await sleep(CFG.cueMs);
  show(FIX); await sleep(CFG.isiMs);
  show(targetHTML(side)); await frame();
  const tTgt = performance.now();
  const r = await waitKey(['f','j'], CFG.maxRT);
  const resp = r ? (r.key==='f' ? 'left' : 'right') : '';
  const correct = resp === side;
  if (feedback) { show(`<div class="msg">${!r ? 'Too slow' : correct ? 'Correct' : 'Wrong key'}</div>`); await sleep(FAST ? 20 : 600); }
  show(FIX); await sleep(CFG.itiMin + Math.random()*(CFG.itiMax-CFG.itiMin));
  return {response:resp, correct:correct?1:0, RT: r ? Math.round(r.rt) : '', timeout: r ? 0 : 1,
          anticipation: r && r.rt<150 ? 1 : 0, soa_actual_ms: Math.round(tTgt - tCue), hidden_during_trial: hiddenFlag ? 1 : 0};
}

async function probe(cue, ph, trialNo) {
  show(`<div class="msg">Where do you expect the square to appear after this shape?</div>${cueHTML(cue)}<div class="sub"><kbd>F</kbd> left &nbsp; <kbd>J</kbd> right</div>`);
  const a = await waitKey(['f','j']);
  const side = a.key==='f' ? 'left' : 'right';
  show(`<div class="msg">How sure are you?</div><div class="sub"><kbd>1</kbd> guessing &nbsp; <kbd>2</kbd> unsure &nbsp; <kbd>3</kbd> fairly sure &nbsp; <kbd>4</kbd> certain</div>`);
  const c = await waitKey(['1','2','3','4']);
  show(FIX); await sleep(FAST ? 20 : 500);
  return {row_type:'probe', trial:trialNo, phase:ph, phase_name:PHASE_NAMES[ph], cue,
          probe_expected_side:side, rule_side:ruleSide(cue,ph), explicit_matches_rule: side===ruleSide(cue,ph) ? 1 : 0,
          probe_confidence:+c.key, RT_probe_ms:Math.round(a.rt)};
}

const onBeforeUnload = e => { e.preventDefault(); e.returnValue = ''; };
const base = () => ({session_id:P.session_id, participant_id:P.participant_id, run_mode:P.run_mode, age:P.age, gender:P.gender,
                     course:P.course, validity_pct:P.validity_pct, mapping:P.mapping});
function addRow(r) { rowIdx++; const row = {row_key:`${P.session_id}:${rowIdx}`, ...base(), ...r, timestamp:new Date().toISOString()}; rows.push(row); return row; }

/* Send a block's rows in the background; if the server does not confirm, they stay queued in this browser. */
let lastSend = Promise.resolve();
function sendBlock(blockRows) {
  queue(P.session_id, blockRows);
  lastSend = lastSend.then(() => flush(P.session_id));
  return lastSend;
}

async function runAll() {
  if (STARTED) return;            // the task can run only once per page load
  STARTED = true;
  if (document.activeElement) document.activeElement.blur();
  window.addEventListener('beforeunload', onBeforeUnload);
  try { if (!FAST) await document.documentElement.requestFullscreen?.(); } catch (e) {}
  hiddenCount = 0;

  /* Practice: random side, not saved. Must get >= 4 of 6 correct to continue (max 3 rounds), so people who
     have not understood they must press on EVERY square are caught before the real data starts. */
  show(`<div class="msg">Practice<div class="sub">Press <kbd>Space</kbd> to begin</div></div>`); await waitKey([' ']);
  P.practice_rounds = 0;
  while (true) {
    P.practice_rounds++; let ok = 0;
    for (let i=0;i<CFG.practice;i++) ok += (await trial(i%2 ? 'blue' : 'orange', Math.random()<.5 ? 'left' : 'right', true)).correct;
    P.practice_correct = ok;
    if (ok >= 4 || P.practice_rounds >= 3) break;
    show(`<div class="msg">You got ${ok} of ${CFG.practice} correct.<br><br>Press <kbd>F</kbd> for a square on the left and <kbd>J</kbd> for a square on the right, <b>every time</b> a square appears, within about one second.<div class="sub">Press <kbd>Space</kbd> to try the practice again</div></div>`);
    await waitKey([' ']);
  }
  show(`<div class="msg">Practice complete.<div class="sub">Press <kbd>Space</kbd> to start Block 1 of 3</div></div>`); await waitKey([' ']);

  const v = P.validity_pct/100;
  let n = 0, probeCount = 0, streak = 0;
  for (let p=0;p<3;p++) {
    if (p > 0) {
      show(`<div class="msg">Block ${p} of 3 complete.<br><br>Take a short rest if needed.<div class="sub">Press <kbd>Space</kbd> to start Block ${p+1} of 3</div></div>`);
      await waitKey([' ']);
    }
    const list = buildPhase(p+1, CFG.phases[p], v), blockStart = rows.length;
    for (let i=0;i<list.length;i++) {
      const t = list[i]; n++;
      const rs = ruleSide(t.cue, t.phase);
      const side = t.valid ? rs : opp(rs);
      const res = await trial(t.cue, side, false);
      streak = res.timeout ? streak + 1 : 0;
      if (streak >= 5) {          // participant has stopped responding: remind once per streak
        P.timeout_warnings = (P.timeout_warnings || 0) + 1; streak = 0;
        show(`<div class="msg">You have not responded to the last few squares.<br><br>Press <kbd>F</kbd> (left) or <kbd>J</kbd> (right) as soon as each square appears.<div class="sub">Press <kbd>Space</kbd> to continue</div></div>`);
        await waitKey([' ']);
      }
      addRow({row_type:'trial', trial:n, phase:t.phase, phase_name:PHASE_NAMES[t.phase], trial_in_phase:i+1,
              cue:t.cue, rule_side:rs, target_side:side, validity:t.valid?'valid':'invalid', ...res});
      if (n % CFG.probeEvery === 0) addRow(await probe(probeCount++ % 2 ? 'orange' : 'blue', t.phase, n));
    }
    sendBlock(rows.slice(blockStart));
  }
  show(`<div class="msg">Last question.<br><br>Did you notice that what a shape meant changed at some point?<div class="sub"><kbd>Y</kbd> yes &nbsp; <kbd>N</kbd> no</div></div>`);
  const q = await waitKey(['y','n']);
  P.noticed_change = q.key==='y' ? 1 : 0;
  rows.forEach(r => r.noticed_change = P.noticed_change);
  const all = ls.get(BACKUP, []); ls.set(BACKUP, all.concat(rows));          // local backup of every session

  show('<div class="msg">Saving your data… please wait, do not close this page.</div>');
  await lastSend;
  queue(P.session_id, rows, {action:'complete', session_id:P.session_id, noticed_change:P.noticed_change, tab_hidden_count:hiddenCount,
         practice_rounds:P.practice_rounds, practice_correct:P.practice_correct, timeout_warnings:P.timeout_warnings || 0});
  const res = await flush(P.session_id);
  P.saved = !!(res.ok && res.complete);
  P.saveInfo = res;
  if (P.saved) window.removeEventListener('beforeunload', onBeforeUnload);
  try { if (document.fullscreenElement) await document.exitFullscreen(); } catch (e) {}
  renderEnd();
}

/* ---------- results & export ---------- */
function toCSV(data) {
  const cols = []; data.forEach(r => Object.keys(r).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  return [cols.join(','), ...data.map(r => cols.map(c => q(r[c])).join(','))].join('\n');
}
function download(text, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/csv'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

function renderEnd() {
  hideStage();
  const T = rows.filter(r=>r.row_type==='trial'), Pb = rows.filter(r=>r.row_type==='probe');
  const body = [1,2,3].map(ph => {
    const t = T.filter(r=>r.phase===ph);
    const ok = t.filter(r=>r.correct && !r.anticipation && !r.timeout);
    const val = mean(ok.filter(r=>r.validity==='valid').map(r=>r.RT));
    const inv = mean(ok.filter(r=>r.validity==='invalid').map(r=>r.RT));
    return `<tr><td>${PHASE_NAMES[ph]}</td><td>${fmt(val)}</td><td>${fmt(inv)}</td><td>${fmt(inv-val)}</td><td>${fmt(mean(t.map(r=>r.correct))*100)}%</td><td>${fmt(mean(Pb.filter(r=>r.phase===ph).map(r=>r.explicit_matches_rule))*100)}%</td></tr>`;
  }).join('');
  const code = `P${String(P.participant_id).padStart(2,'0')}`;
  scr.innerHTML = `
    <h1>Thank you</h1>
    ${P.saved
      ? `<p class="ok"><b>✓ Your data is saved</b> (participant ${code}). You can close this page.</p>`
      : `<div class="banner"><b>Your data has not been confirmed as saved yet</b> (${esc(P.saveInfo.error || 'incomplete: ' + P.saveInfo.trials_saved + '/160 trials')}).
         Please click <b>Retry saving</b>. If it still fails, click <b>Download CSV</b> and send the file to the researcher. Do not close this page first.</div>
         <button id="retry">Retry saving</button>`}
    <p><b>Debrief:</b> the shapes predicted the target side most of the time. In the second block the meaning of the shapes was reversed without warning, and in the third block it switched back. The task measures how quickly you noticed and adjusted. Please don't tell future participants about the switch.</p>
    <table><thead><tr><th>Phase</th><th>Valid RT (ms)</th><th>Invalid RT (ms)</th><th>Cue effect (ms)</th><th>Accuracy</th><th>Rule known</th></tr></thead><tbody>${body}</tbody></table>
    <button class="alt" id="dl">Download CSV</button>
    ${ADMIN ? '<button class="alt" id="next">Next participant</button>' : ''}
    <div class="err" id="err"></div>`;
  $('#dl').onclick = () => download(toCSV(rows), `HRR_${code}_${P.session_id.slice(0,8)}.csv`);
  if ($('#retry')) $('#retry').onclick = async () => {
    $('#retry').disabled = true; $('#err').textContent = 'Retrying…';
    queue(P.session_id, rows); const res = await flush(P.session_id); P.saved = !!(res.ok && res.complete); P.saveInfo = res; renderEnd();
  };
  if ($('#next')) $('#next').onclick = () => location.reload();     // fresh page = fresh state for the next person
}

renderForm();
</script>
